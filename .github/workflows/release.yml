name: release

# Push a tag vX.Y.Z to cut a release. The tag must match the version already bumped
# into the manifests (scripts/bump_version.py) — this re-runs the full gate, enforces
# tag↔manifest agreement, then publishes a GitHub Release with auto-generated notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Python manifests and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate manifests, kit JSON, schema, frontmatter, version sync
        run: python scripts/check_manifests.py

      - name: Tag must match manifest version
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import sys

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = json.loads(Path("plugin.json").read_text(encoding="utf-8"))["version"]
          if tag != version:
              print(f"::error::tag v{tag} != manifest version {version} — run python scripts/bump_version.py {tag}, commit, then re-tag", file=sys.stderr)
              raise SystemExit(1)
          print(f"tag matches manifest version: {version}")

  session-browser:
    name: Session browser accessibility and layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate actual browser accessibility and responsive layout
        env:
          PYTHON: python
          COMPANION_VISUAL_OUTPUT: ${{ runner.temp }}/architrave-session-visual
        run: node --experimental-vm-modules scripts/test-session-companion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-browser-contract
          path: ${{ runner.temp }}/architrave-session-visual

  windows-python:
    name: Windows Python harness and gate fixtures
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installer safety fixtures
        run: python scripts/test_install_update.py
      - name: Native host fixtures
        run: python scripts/test-native-host.py
      - name: OpenCode host fixtures
        run: python scripts/test-opencode-host.py
      - name: Component fixtures
        run: python scripts/test-components.py
      - name: Native review fixtures
        run: python scripts/test-native-review.py
      - name: Native review transport fixtures
        run: node --experimental-vm-modules scripts/test-native-review.mjs
      - name: Quality cadence fixtures
        run: python scripts/test-quality-cadence.py
      - name: Route ribbon fixtures
        run: python scripts/test-ribbon.py
      - name: Targeted legibility fixtures
        run: python scripts/test-legibility.py -k web_requires_health -k repeated_and_independent -k refreshed_visual
      - name: Route ribbon renderer fixtures
        run: node --experimental-vm-modules scripts/test-ribbon.mjs
      - name: Session companion fixtures
        run: node --experimental-vm-modules scripts/test-session-companion.mjs
      - name: Configuration profile fixtures
        run: python scripts/test-config-profiles.py
      - name: Run validator fixtures
        run: python scripts/test-validate-run.py
      - name: Learning validator fixtures
        run: python scripts/test-improvement.py ValidationTests
      - name: Lesson promotion fixtures
        run: python scripts/test-improvement.py PromotionTests
      - name: Stale and semantic learning fixtures
        run: python scripts/test-learning-tools.py
      - name: Gate fixtures
        run: python scripts/test-gates.py
      - name: Manifest scanner fixtures
        run: python scripts/test-manifest-scanner.py

  release:
    needs: [validate, windows-python, session-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
