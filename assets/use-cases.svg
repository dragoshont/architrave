<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">Architrave use cases</title>
  <desc id="description">Six areas of work: research and knowledge; UI and product experience; services and full stack; maintenance and integration; review and delivery; and platform and extensions. The shared approach is to specify an outcome, scope the work, verify the result, and deliver or explain the blocker. Optional support includes resumable Runs, repository lessons and program oversight. Infrastructure changes, deployment and installation require scoped authorization and actual evidence. Capabilities depend on the host and repository; this is not a guarantee of autonomous production delivery.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #142b43; font-size: 30px; font-weight: 700; }
      .intro { fill: #44566b; font-size: 17px; }
      .card { fill: #ffffff; stroke: #c9d5e0; stroke-width: 1.5; }
      .number { fill: #176557; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .label { fill: #142b43; font-size: 20px; font-weight: 650; }
      .body { fill: #3e5268; font-size: 16px; }
      .step { fill: #ffffff; font-size: 17px; font-weight: 600; }
      .note { fill: #44566b; font-size: 15px; }
      .arrow { fill: none; stroke: #456b89; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#456b89"/>
    </marker>
  </defs>
  <rect width="1000" height="760" rx="18" fill="#f3f7fa"/>
  <text class="heading" x="32" y="52">Where Architrave helps</text>
  <text class="intro" x="32" y="84">One requirement-led approach, adapted to the work.</text>

  <g class="card">
    <rect x="32" y="112" width="300" height="184" rx="12"/>
    <rect x="350" y="112" width="300" height="184" rx="12"/>
    <rect x="668" y="112" width="300" height="184" rx="12"/>
    <rect x="32" y="314" width="300" height="184" rx="12"/>
    <rect x="350" y="314" width="300" height="184" rx="12"/>
    <rect x="668" y="314" width="300" height="184" rx="12"/>
  </g>
  <g class="number">
    <text x="52" y="140">01 / UNDERSTAND</text>
    <text x="370" y="140">02 / DESIGN</text>
    <text x="688" y="140">03 / BUILD</text>
    <text x="52" y="342">04 / IMPROVE</text>
    <text x="370" y="342">05 / CHALLENGE</text>
    <text x="688" y="342">06 / EXTEND</text>
  </g>
  <g class="label">
    <text x="52" y="174">Research &amp; knowledge</text>
    <text x="370" y="174">UI &amp; product experience</text>
    <text x="688" y="174">Services &amp; full stack</text>
    <text x="52" y="376">Maintenance &amp; integration</text>
    <text x="370" y="376">Review &amp; delivery</text>
    <text x="688" y="376">Platform &amp; extensions</text>
  </g>
  <g class="body">
    <text x="52" y="210"><tspan x="52">Find and verify sources</tspan><tspan x="52" dy="26">Write docs, scripts and research</tspan><tspan x="52" dy="26">Preserve decisions and evidence</tspan></text>
    <text x="370" y="210"><tspan x="370">Design systems and native UX</tspan><tspan x="370" dy="26">Admin, jobs and onboarding</tspan><tspan x="370" dy="26">Accessibility and visual checks</tspan></text>
    <text x="688" y="210"><tspan x="688">API and data contracts</tspan><tspan x="688" dy="26">Backend implementation</tspan><tspan x="688" dy="26">Migrations and rollback plans</tspan></text>
    <text x="52" y="412"><tspan x="52">Debug, refactor and reconcile</tspan><tspan x="52" dy="26">Coordinate cross-repo changes</tspan><tspan x="52" dy="26">Recover interrupted work</tspan></text>
    <text x="370" y="412"><tspan x="370">Review code and real sessions</tspan><tspan x="370" dy="26">Compare consequential options</tspan><tspan x="370" dy="26">Test and qualify releases*</tspan></text>
    <text x="688" y="412"><tspan x="688">Infrastructure plans*</tspan><tspan x="688" dy="26">Runtime observation*</tspan><tspan x="688" dy="26">Agent, skill and MCP authoring</tspan></text>
  </g>

  <g fill="#173f5f">
    <rect x="32" y="534" width="216" height="54" rx="9"/>
    <rect x="272" y="534" width="216" height="54" rx="9"/>
    <rect x="512" y="534" width="216" height="54" rx="9"/>
    <rect x="752" y="534" width="216" height="54" rx="9"/>
  </g>
  <g class="step" text-anchor="middle">
    <text x="140" y="568">Specify the outcome</text>
    <text x="380" y="568">Scope the work</text>
    <text x="620" y="568">Verify the result</text>
    <text x="860" y="568">Deliver or name blocker</text>
  </g>
  <path class="arrow" d="M251 561H267"/>
  <path class="arrow" d="M491 561H507"/>
  <path class="arrow" d="M731 561H747"/>

  <rect x="32" y="610" width="936" height="42" rx="9" fill="#e1efe9"/>
  <text class="body" x="52" y="637">Optional support: resumable Runs, evidence-backed repository lessons and program oversight.</text>
  <text class="note" x="32" y="687">* Plans and observation first. Deployment, installation and runtime changes need scoped authorization.</text>
  <text class="note" x="32" y="715">Uses host sessions, tools and permissions. Availability and qualification depend on host and repository.</text>
  <text class="note" x="32" y="739">A capability map, not a guarantee of autonomous delivery or production readiness.</text>
</svg>
